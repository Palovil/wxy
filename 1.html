<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>王欣怡</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 30%, #a78bfa 100%);
            overflow: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(68px);
            opacity: 0.45;
            z-index: 0;
        }

        body::before {
            background: rgba(255, 255, 255, 0.35);
            top: -80px;
            left: -60px;
        }

        body::after {
            background: rgba(93, 63, 211, 0.28);
            right: -70px;
            bottom: -100px;
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(88vw, 420px);
            padding: 32px 28px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 24px 60px rgba(91, 57, 169, 0.24);
            text-align: center;
            animation: fadeUp 0.9s ease-out;
        }

        .avatar {
            width: 92px;
            height: 92px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #f3e8ff);
            display: grid;
            place-items: center;
            font-size: 2.1rem;
            font-weight: 700;
            color: #6d28d9;
            box-shadow: 0 14px 28px rgba(255, 255, 255, 0.3);
        }

        .tag {
            display: inline-block;
            margin-bottom: 16px;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.9);
            font-size: 0.76rem;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: clamp(2rem, 5vw, 2.9rem);
            letter-spacing: 0.08em;
            text-shadow: 0 10px 28px rgba(0,0,0,0.14);
        }

        .subtitle {
            margin: 16px 0 0;
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            line-height: 1.7;
        }

        .chips {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        .chip {
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 0.82rem;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="avatar">W</div>
        <span class="tag">HELLO</span>
        <h1>26 王欣怡</h1>
        <p class="subtitle">愿每一天都充满光彩，像晨光一样温柔而坚定。</p>
        <div class="chips">
            <span class="chip">Creative</span>
            <span class="chip">Warm</span>
            <span class="chip">Bright</span>
        </div>
    </main>
</body>
</html>
