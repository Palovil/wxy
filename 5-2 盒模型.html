<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型，box model</title>
    <style>
        body,h2,h1,ul{
            padding: 0;
            margin: 0;
        }
        #a{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            padding: 50px 40px 30px 20px;
            margin: 40px auto;
        }
        #b{
            width: 400px;
            height: 400px;
            border: 1px dashed #039;
            padding: 50px auto 40px;
        }
        #c,
        #d{
            width: 400px;
            height: 400px;
            border: 3px dotted #039;
        }
        #b,
        #c,
        #d{
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <div id="a">226王欣怡</div>
    <div id="b">226王欣怡</div> 
    <div id="c">226王欣怡</div>
    <div id="d">226王欣怡</div>
   
</body>
</html>
