<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王欣怡的 CSS Animation 幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            border-top: 5px solid #c65e49;
            background-color: #f1f0e9;
            background-image: linear-gradient(rgba(38, 51, 46, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(38, 51, 46, 0.035) 1px, transparent 1px);
            background-size: 48px 48px;
            color: #26332e;
            font-family: "Microsoft YaHei", sans-serif;
        }

        main {
            width: min(900px, 100%);
        }

        .gallery-frame {
            position: relative;
            padding: 10px;
            border: 1px solid rgba(38, 51, 46, 0.14);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 24px 64px rgba(38, 51, 46, 0.16), 0 3px 10px rgba(38, 51, 46, 0.08);
        }

        .slideshow {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 3px;
            background: #18201d;
        }

        .slideshow::after {
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            content: "";
            pointer-events: none;
        }

        .slide {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
            animation: show-slide 12s infinite;
        }

        .slide:nth-child(2) {
            animation-delay: -4s;
        }

        .slide:nth-child(3) {
            animation-delay: -8s;
        }

        .slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: photo-drift 12s ease-in-out infinite;
        }

        .slide:nth-child(2) img {
            animation-delay: -4s;
        }

        .slide:nth-child(3) img {
            animation-delay: -8s;
        }

        .slide p {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            margin: 0;
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        }

        @keyframes show-slide {
            0%, 4% {
                opacity: 0;
            }
            8%, 28% {
                opacity: 1;
            }
            33%, 100% {
                opacity: 0;
            }
        }

        @keyframes photo-drift {
            0%, 100% {
                transform: scale(1.03);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 22px 14px;
            }

            .gallery-frame {
                padding: 6px;
            }

            .slideshow {
                aspect-ratio: 3 / 4;
            }

            .slide p {
                padding: 13px 15px;
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .slide {
                animation: none;
            }

            .slide:first-child {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="gallery-frame">
            <section class="slideshow" aria-label="自动播放的图片幻灯片">
                <article class="slide">
                    <img src="img/0.jpg" alt="幻灯片图片 1">
                    <p>王欣怡 · 图片 1</p>
                </article>
                <article class="slide">
                    <img src="img/1.jpg" alt="幻灯片图片 2">
                    <p>王欣怡 · 图片 2</p>
                </article>
                <article class="slide">
                    <img src="img/2.jpg" alt="幻灯片图片 3">
                    <p>王欣怡 · 图片 3</p>
                </article>
            </section>
        </div>
    </main>
</body>
</html>
