<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }
        #box{
            width: 480px;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 12px;
            margin: 20px;
        }
        #box h3{
            font-size: 16px;
            text-align: center;
            line-height: 33px;
            letter-spacing: 3px;
            color: #036;
        }
        #box p{
            line-height: 150%;
            color: #666;
            text-indent: 2em;
        }
        #box .student-id{
            color: #06c;
            font-weight: bold;
        }
        #box .student-name{
            color: #222;
            font-weight: bold;
        }
        #box .difficulty{
            color: #f00;
            font-weight: bold;
        }
        #box .knowledge-points{
            border: 1px solid purple;
            color: purple;
            padding: 2px 4px;
        }
        #box a{
            color: #f11;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
        学号：<span class="student-id">226</span>，姓名：<span class="student-name">王欣怡</span>，班级：计算机24011，对于《高级网页设计》课程的难度认知：<span class="difficulty">难</span>，
        这个例子对应的知识点是：<span class="knowledge-points">群组选择器、后代选择器、层叠与继承</span>。
        <a href="#">更多</a>
        </p>
    </div>
</body>
</html>
