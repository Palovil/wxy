<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            display: flex;
            padding: 10px 5px;
            margin-bottom: 5px;
            border-bottom: 1px dotted #ccc;
            align-items: flex-start;
        }
        .zitem img{
            width: 100px;
        }
        .ytext{
            flex-grow: 1;
            margin-left: 10px;
            display: flex;
            flex-wrap: wrap;
            font-size: 12px;
            color: #999;
        }
        .ytext h3{
            width: 100%;
            font-size: 16px;
            line-height: 40px;
            color: #333;
        }
        .author{
            flex-grow: 1;
            padding-left: 3px;
        }
        .time{
            margin-left: 20px;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="zitem">
        <img src="img/0.jpg">
    </div>
    <div class="ytext">
        <h3>标题</h3>
        <span class="author">王欣怡</span>
        <span class="time">2020-10-10</span>
    </div>
</div>
<div class="box">
    <div class="zitem">
        <img src="img/1.jpg">
    </div>
    <div class="ytext">
        <h3>标题</h3>
        <span class="author">王欣怡</span>
        <span class="time">2020-10-10</span>
    </div>
</div>
<div class="box">
    <div class="zitem">
        <img src="img/2.jpg">
    </div>
    <div class="ytext">
        <h3>标题</h3>
        <span class="author">王欣怡</span>
        <span class="time">2020-10-10</span>
    </div>
</div>
</body>
</html>
