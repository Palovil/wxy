    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: #f4f4f4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .wang_content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            background: #fff;
        }
        .wang_tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: flex-end;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 1000;
        }
        .wang_tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: #999;
            text-decoration: none;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }
        .wang_tab-item svg {
            width: 28px;
            height: 28px;
            display: block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .wang_tab-item .wang_label {
            font-size: 11px;
            line-height: 1.2;
            margin-top: 4px;
            font-weight: 400;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .wang_tab-item.active {
            color: #f03d37;
        }
        .wang_tab-item.active svg {
            transform: scale(1.15);
        }
        .wang_tab-item.active .wang_label {
            font-size: 14px;
            font-weight: 700;
            margin-top: 2px;
        }
        .wang_tab-item.wang_text-only .wang_label {
            font-size: 18px;
            font-weight: 700;
            margin-top: 10px;
            line-height: 1.1;
        }
        .wang_tab-item.wang_text-only .wang_sub-label {
            font-size: 11px;
            font-weight: 400;
            margin-top: 2px;
            line-height: 1.2;
            color: inherit;
        }
        .wang_tab-item.wang_text-only.active .wang_label {
            font-size: 22px;
            font-weight: 700;
            margin-top: 8px;
        }
        .wang_tab-item.wang_text-only.active .wang_sub-label {
            font-size: 12px;
            font-weight: 400;
        }
        .wang_badge {
            position: absolute;
            top: -2px;
            left: 50%;
            margin-left: 8px;
            min-width: 16px;
            height: 16px;
            background: #f03d37;
            border-radius: 8px;
            font-size: 10px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            line-height: 1;
            font-style: normal;
            font-weight: 400;
            border: 2px solid #fff;
        }
        .wang_dot {
            position: absolute;
            top: 2px;
            left: 50%;
            margin-left: 10px;
            width: 8px;
            height: 8px;
            background: #f03d37;
            border-radius: 50%;
            border: 1.5px solid #fff;
        }
    </style>
