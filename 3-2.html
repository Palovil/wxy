<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>226王欣怡</title>
    <style>
        p{
            color: #94a;
            font-size: 50px;
        }
        h2{
            color: white;
            background-color: black;
        }
        .selector-name{
            color: white;
        }
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        #box2{
            width: 300px;
            height: 300px;
            background-color: #9cf;
        }
        .z1{
            color: blue;
        }
        .z2{
            color: red;
        }
        .z3{
            color: green;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span class="selector-name">选择器</span></p>
        <p><span class="z1">王</span><span class="z2">欣</span><span class="z3">怡</span></p>
        <p>CSS属性</p>
    </div>
    <div id="box2"></div>
</body>
</html>
