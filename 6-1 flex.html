<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            padding: 20px;
        }
        .container-wrap{
            display: flex;
            gap: 20px;
        }
        .box-wrap{
            width: 24vw;
            aspect-ratio: 1 / 1;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .item{
            background-color: #e2e2e2;
            border:1px solid #222;
        }
        /* 1. 单个方块 */
        .case1{
            width: 110px;
            height: 110px;
        }
        /* 2. 上下两个矩形 */
        .case2{
            display: flex;
            flex-direction: column;
            gap:10px;
        }
        .case2 .item{
            width:160px;
            height:70px;
        }
        /* 3. 2x2四个横向长方形【只修改这里】 */
        .case3{
            display: flex;
            flex-wrap: wrap;
            gap:10px;
            width:200px;
        }
        .case3 .item{
            width: calc(50% - 5px);
            height: 70px;
        }
        /* 4. 上通栏，下两个 */
        .case4{
            display: flex;
            flex-direction: column;
            gap:10px;
            width:180px;
        }
        .case4 .top-item{
            width:100%;
            height:70px;
        }
        .case4 .bottom-row{
            display: flex;
            gap:10px;
        }
        .case4 .bottom-row .item{
            flex:1;
            height:70px;
        }
    </style>
</head>
<body>
    <h2>王欣怡 flex</h2>
    <div class="container-wrap">
        <!-- 第一个 -->
        <div class="box-wrap">
            <div class="item case1"></div>
        </div>
        <!-- 第二个 -->
        <div class="box-wrap">
            <div class="case2">
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>
        <!-- 第三个：4个横向长方形，宽大于高 -->
        <div class="box-wrap">
            <div class="case3">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>
        <!-- 第四个 -->
        <div class="box-wrap">
            <div class="case4">
                <div class="item top-item"></div>
                <div class="bottom-row">
                    <div class="item"></div>
                    <div class="item"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
