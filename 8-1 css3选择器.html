<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-color: #f2f3f4;
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 159px;
            border: 1px solid #ccc;
            margin: 10px;
            background-color: white;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.6s;
            box-sizing: border-box;
        }
        .box:first-child:hover{
            background-color: #000;
            color: #fff;
            font-size: 100px;
            border-width: 30px;
        }
        .box:nth-child(2):hover{
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        }
        .box:nth-child(3):hover{
            text-shadow: 100px 0px 20px rgba(0, 0, 0, 0.5);
        }
        .box:nth-of-type(4):hover{
            border-radius: 50%;
        }
        .box:nth-of-type(5){
            background:linear-gradient(#000,#fff)
        }
        .box:nth-of-type(6){
            background:radial-gradient(#fff,#000)
        }
        .box:nth-of-type(6)+.box:hover{
            transform: scale(0.5);
        }
        .box:nth-of-type(8):hover{
            transform: translateX(-100px);
        }
        .box:nth-of-type(9):hover{
            transform: rotateZ(180deg);
        }
        .box:nth-of-type(10):hover{
            transform: skewX(-45deg);
        }
        .box:nth-last-child(2):hover::before{
            content:"#";
            color: red;
            
        }
        .box:last-child:hover::after{
            content: "王欣怡";
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 20px;
            margin-left: 16px;
        }
        .box:nth-child(even):hover{
            background-color: #ff7a59;
            color: #fff;
            border-color: #ff7a59;
            transform: translateY(-12px) rotate(4deg);
            box-shadow: 0 12px 20px rgba(255, 122, 89, 0.35);
        }
        .box:last-child:hover{
            background-color: #ff7a59;
            color: #fff;
            border-color: #ff7a59;
            transform: translateY(-12px) rotate(4deg);
            box-shadow: 0 12px 20px rgba(255, 122, 89, 0.35);
        }
        .box:last-child:hover > span{
            display: none;
        }
        .box:last-child:hover::after{
            margin-left: 0;
            font-size: 20px;
        }
        .box:nth-of-type(3n):hover{
            border: 3px solid #f00;
        }
        
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box"><span>12</span></div>
    </div>
</body>
</html>
